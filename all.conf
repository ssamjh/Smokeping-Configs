# Smokeping-Configs - master include
#
# Include this single file from your main Targets file and you get every
# provider in this repo:
#
#     @include /config/Smokeping-Configs/all.conf
#
# New providers added upstream then arrive with a plain `git pull`, with no
# change needed on your side.
#
# The paths below are relative to this file, so the repo works wherever you
# clone it.
#
# Want only some providers? Don't edit this file - local edits here will
# conflict on your next pull. Instead, skip all.conf and @include the
# individual provider files you want directly from your Targets file.

@include dns.conf
@include dns_probe.conf

@include alibaba.conf
@include amazonaws.conf
@include hetzner.conf
@include linode.conf
@include oraclecloud.conf
@include ovh.conf
@include vultr.conf
